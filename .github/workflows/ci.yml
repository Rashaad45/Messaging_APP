name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

# Cancel an older run on the same branch when a newer commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android (lint, tests, debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Caches Gradle dependencies/build cache and validates the wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null

      # google-services.json is not committed (docs/DECISIONS.md D-007). Use the real config
      # from the GOOGLE_SERVICES_JSON secret when available, otherwise a placeholder so
      # builds and unit tests still work (the APK then can't talk to Firebase).
      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Using google-services.json from repository secret"
          else
            cp ci/google-services.ci.json app/google-services.json
            echo "::warning::GOOGLE_SERVICES_JSON secret not set; APK artifact uses a placeholder Firebase config"
          fi

      - name: Static analysis (ktlint, detekt, Android lint)
        run: ./gradlew ktlintCheck detekt lintDebug --continue

      - name: Unit tests (JVM + Robolectric Compose tests)
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: messenger-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  firestore-rules:
    name: Firestore security rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firestore-tests
    steps:
      - uses: actions/checkout@v7

      # The Firestore emulator (firebase-tools 15) requires Java 21+.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Run rules tests against the emulator
        run: npm test
